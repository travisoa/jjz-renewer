# 复制为 config.toml；车牌和申请模板须按本人实际情况填写。
# 一辆车一份配置：auth-set --login 或 vehicles --create 会为账号下其他车辆生成 config-car2.toml 等；
# 手动新建运行 python3 -m jjz --config config-<名称>.toml init（名称只用英文字母、数字、- 和 _），之后的命令都加同一个 --config。
[api]
base_url = "https://jjz.jtgl.beijing.gov.cn"
# 凭证和登录文件的路径可改，但须放在 secrets/ 下或仓库之外；.gitignore 只保护这些默认位置和文件名。
# 同一账号下的车辆共用这两个文件；不同账号的车辆各指向自己的文件。
auth_file = "secrets/authorization.txt"
login_file = "secrets/login.toml" # 可选，登录手机号和密码只放这里，不写进本文件
auto_relogin = true # 凭证失效时用 login_file 的密码和本机验证码识别自动登录一次，识别不出直接报错；不保存密码时改为 false
timeout_seconds = 20

[vehicle]
plate = "冀A00000" # 替换为本人车牌，避免处理同账号下其他车辆
default_permit = "outside" # 日常自动续六环外；六环内通过 --permit inside 手动选择

[renewal]
earliest_time = "08:00" # 北京时间
outside_lead_days = 0 # 默认到期当天申请次日生效；1 仅在本人接口确认允许时使用
submission_enabled = false # 完成在线只读核验后再开启
auto_renew = true # 自动续办；false 为按需办理：定时任务和定时代理跳过，只在本人点名时处理

[storage]
data_dir = "data" # 提交记录、运行锁和定时任务日志；每辆车的配置各用独立目录，如 data/car2

[application]
# 对应 App「进京信息」页。车辆、驾驶人、证件类型和进京日期由程序在提交前向服务端获取。
# 坐标均为高德（GCJ-02）经纬度。空值会阻止真实提交。
jjmd = "" # 进京目的代码，多选用英文逗号分隔：01 自驾旅游 02 看病就医 03 探亲访友 04 学习培训 05 公务差旅 06 其它
jjmdmc = "" # 与 jjmd 一一对应的名称，同样用英文逗号分隔
area = "" # 目的地区县名称，如 朝阳区
jjdq = "" # 目的地区县代码：001 东城 002 西城 003 朝阳 004 丰台 005 石景山 006 海淀 007 门头沟 008 房山 009 通州 010 顺义 011 昌平 012 大兴 013 怀柔 014 平谷 015 密云 016 延庆 017 开发区
xxdz = "" # 目的地详细地址
jjdzgdjd = "" # 目的地经度
jjdzgdwd = "" # 目的地纬度
sfzj = "" # 申请时车辆是否已在京：1 在京（填 zjxxdz 三项）；0 不在京（填 jjlk 四项）
zjxxdz = "" # 在京详细地址
zjxxdzgdjd = ""
zjxxdzgdwd = ""
jjlk = "" # 进京道路代码，如 00306（京沪高速应寺检查站）
jjlkmc = "" # 进京道路名称，与 App 显示一致
jjlkgdjd = ""
jjlkgdwd = ""
sqdzgdjd = "" # 提交申请时所在位置的经度（App 取手机定位）
sqdzgdwd = "" # 提交申请时所在位置的纬度
txrxx = [] # 同行人；服务端未开启同行人登记时保持空数组

[inside_application]
# 手动办理六环内时使用独立模板，字段同上，不能假设与六环外目的地相同。
jjmd = ""
jjmdmc = ""
area = ""
jjdq = ""
xxdz = ""
jjdzgdjd = ""
jjdzgdwd = ""
sfzj = ""
zjxxdz = ""
zjxxdzgdjd = ""
zjxxdzgdwd = ""
jjlk = ""
jjlkmc = ""
jjlkgdjd = ""
jjlkgdwd = ""
sqdzgdjd = ""
sqdzgdwd = ""
txrxx = []
